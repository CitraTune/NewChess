name: Godot prototype checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned portable Godot engine
        shell: pwsh
        run: ./tools/setup-godot.ps1 -SkipEditorIntegration
      - name: Rules, multiplayer and headless interface checks
        shell: pwsh
        run: ./tools/godot.ps1 Verify -Headless
